<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <style>
      .card-bg {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1.5;
        rx: 8px;
        ry: 8px;
      }
      .card-header {
        fill: #161b22;
        rx: 8px;
        ry: 8px;
      }
      .header-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #ffffff;
      }
      .header-meta {
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 11px;
        fill: #8b949e;
      }
      .table-header {
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-weight: bold;
        font-size: 11px;
        fill: #8b949e;
      }
      .table-port {
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-weight: bold;
        font-size: 12px;
        fill: #00ff66;
      }
      .table-protocol {
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 12px;
        fill: #00f0ff;
      }
      .table-endpoint {
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-weight: 500;
        font-size: 12px;
        fill: #ffffff;
      }
      .divider {
        stroke: #21262d;
        stroke-width: 1;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="100%" height="100%" class="card-bg"/>

  <!-- Card Header -->
  <path d="M 1.5 18 A 6.5 6.5 0 0 1 8 1.5 L 792 1.5 A 6.5 6.5 0 0 1 798.5 8 L 798.5 40 L 1.5 40 Z" class="card-header"/>
  <text x="25" y="25" class="header-title">REMOTE_TUNNELS // SECURE_ESTABLISHMENT</text>
  <text x="775" y="25" text-anchor="end" class="header-meta">TUNNELS: INBOUND_PORTS</text>

  <!-- Table Headers -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" class="table-header">PORT</text>
    <text x="150" y="0" class="table-header">PROTOCOL</text>
    <text x="350" y="0" class="table-header">CONNECTION ENDPOINT</text>
    <line x1="-20" y1="10" x2="720" y2="10" class="divider" />
  </g>

  <!-- Row 1: WhatsApp -->
  <g transform="translate(50, 95)">
    <text x="0" y="0" class="table-port">Port 8080</text>
    <text x="150" y="0" class="table-protocol">WhatsApp</text>
    <text x="350" y="0" class="table-endpoint">wa.me/212658057634</text>
    <line x1="-20" y1="10" x2="720" y2="10" class="divider" />
  </g>

  <!-- Row 2: Email -->
  <g transform="translate(50, 125)">
    <text x="0" y="0" class="table-port">Port 443</text>
    <text x="150" y="0" class="table-protocol">Secure SMTP</text>
    <text x="350" y="0" class="table-endpoint">soubicharaf@gmail.com</text>
    <line x1="-20" y1="10" x2="720" y2="10" class="divider" />
  </g>

  <!-- Row 3: LinkedIn -->
  <g transform="translate(50, 155)">
    <text x="0" y="0" class="table-port">Port 22</text>
    <text x="150" y="0" class="table-protocol">SSH-LinkedIn</text>
    <text x="350" y="0" class="table-endpoint">linkedin.com/in/charaf-soubi-0818462a6</text>
    <line x1="-20" y1="10" x2="720" y2="10" class="divider" />
  </g>

  <!-- Row 4: Instagram -->
  <g transform="translate(50, 185)">
    <text x="0" y="0" class="table-port">Port 990</text>
    <text x="150" y="0" class="table-protocol">Secure-Insta</text>
    <text x="350" y="0" class="table-endpoint">@soubi_charaf</text>
    <line x1="-20" y1="10" x2="720" y2="10" class="divider" />
  </g>

  <!-- Row 5: Facebook -->
  <g transform="translate(50, 215)">
    <text x="0" y="0" class="table-port">Port 80</text>
    <text x="150" y="0" class="table-protocol">HTTP-Facebook</text>
    <text x="350" y="0" class="table-endpoint">fb.com/profile.php?id=61571625655341</text>
  </g>
</svg>
