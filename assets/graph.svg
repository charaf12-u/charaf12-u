<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
      .card-header { fill: #161b22; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #ffffff; }
      .header-meta { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; fill: #8b949e; }
      .axis-label { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10px; fill: #6a737d; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 500; fill: #c9d1d9; }
      .tooltip-text { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10px; fill: #ffffff; }
      .grid-line { stroke: #21262d; stroke-width: 1; stroke-dasharray: 2 4; }
      .axis-line { stroke: #30363d; stroke-width: 1.5; }
    </style>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="cyan-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="100%" height="100%" class="card-bg" rx="8" ry="8"/>

  <!-- Card Header -->
  <path d="M 1.5 18 A 6.5 6.5 0 0 1 8 1.5 L 792 1.5 A 6.5 6.5 0 0 1 798.5 8 L 798.5 40 L 1.5 40 Z" class="card-header"/>
  <text x="25" y="25" class="header-title">METRIC_REPORT // TRAINING &amp; AUDITING CURVES</text>
  <text x="775" y="25" text-anchor="end" class="header-meta">DEVICE: WAREHOUSE_ANALYTICS</text>

  <!-- Legends below header, above chart, no overlapping -->
  <rect x="80" y="52" width="12" height="6" fill="#00f0ff" rx="1"/>
  <text x="98" y="59" class="legend-text">ML Outlier Anomaly Accuracy</text>
  <rect x="320" y="52" width="12" height="6" fill="#00ff66" rx="1"/>
  <text x="338" y="59" class="legend-text">Intrusion Detection F1</text>

  <!-- Graph Grid Structure (shifted down to give legend room) -->
  <line x1="80" y1="110" x2="740" y2="110" class="grid-line" />
  <line x1="80" y1="160" x2="740" y2="160" class="grid-line" />
  <line x1="80" y1="210" x2="740" y2="210" class="grid-line" />
  <line x1="80" y1="260" x2="740" y2="260" class="grid-line" />
  <line x1="80" y1="310" x2="740" y2="310" class="grid-line" />
  <line x1="80" y1="360" x2="740" y2="360" class="grid-line" />

  <line x1="190" y1="90" x2="190" y2="360" class="grid-line" />
  <line x1="300" y1="90" x2="300" y2="360" class="grid-line" />
  <line x1="410" y1="90" x2="410" y2="360" class="grid-line" />
  <line x1="520" y1="90" x2="520" y2="360" class="grid-line" />
  <line x1="630" y1="90" x2="630" y2="360" class="grid-line" />

  <!-- Y-Axis Labels -->
  <text x="70" y="113" class="axis-label" text-anchor="end">99.8%</text>
  <text x="70" y="163" class="axis-label" text-anchor="end">99.0%</text>
  <text x="70" y="213" class="axis-label" text-anchor="end">98.0%</text>
  <text x="70" y="263" class="axis-label" text-anchor="end">95.0%</text>
  <text x="70" y="313" class="axis-label" text-anchor="end">90.0%</text>
  <text x="70" y="363" class="axis-label" text-anchor="end">80.0%</text>

  <!-- X-Axis Labels -->
  <text x="80"  y="380" class="axis-label" text-anchor="middle">EP 1</text>
  <text x="190" y="380" class="axis-label" text-anchor="middle">EP 5</text>
  <text x="300" y="380" class="axis-label" text-anchor="middle">EP 10</text>
  <text x="410" y="380" class="axis-label" text-anchor="middle">EP 15</text>
  <text x="520" y="380" class="axis-label" text-anchor="middle">EP 20</text>
  <text x="630" y="380" class="axis-label" text-anchor="middle">EP 25</text>
  <text x="740" y="380" class="axis-label" text-anchor="middle">EP 30</text>

  <!-- Axis Lines -->
  <line x1="80" y1="90" x2="80" y2="360" class="axis-line" />
  <line x1="80" y1="360" x2="740" y2="360" class="axis-line" />

  <!-- Area Fills -->
  <path d="M 80 290 L 190 220 L 300 170 L 410 130 L 520 118 L 630 113 L 740 111 L 740 360 L 80 360 Z" fill="url(#cyan-grad)" />
  <path d="M 80 340 L 190 270 L 300 220 L 410 160 L 520 140 L 630 125 L 740 120 L 740 360 L 80 360 Z" fill="url(#green-grad)" />

  <!-- Curve Lines -->
  <path d="M 80 290 L 190 220 L 300 170 L 410 130 L 520 118 L 630 113 L 740 111" fill="none" stroke="#00f0ff" stroke-width="2.5" filter="url(#cyan-glow)" />
  <path d="M 80 340 L 190 270 L 300 220 L 410 160 L 520 140 L 630 125 L 740 120" fill="none" stroke="#00ff66" stroke-width="2.5" filter="url(#green-glow)" />

  <!-- Cyan Nodes -->
  <circle cx="80"  cy="290" r="3.5" fill="#ffffff" stroke="#00f0ff" stroke-width="1.5" />
  <circle cx="300" cy="170" r="3.5" fill="#ffffff" stroke="#00f0ff" stroke-width="1.5" />
  <circle cx="520" cy="118" r="3.5" fill="#ffffff" stroke="#00f0ff" stroke-width="1.5" />
  <circle cx="740" cy="111" r="4.5" fill="#ffffff" stroke="#00f0ff" stroke-width="2" />

  <!-- Green Nodes -->
  <circle cx="190" cy="270" r="3.5" fill="#ffffff" stroke="#00ff66" stroke-width="1.5" />
  <circle cx="410" cy="160" r="3.5" fill="#ffffff" stroke="#00ff66" stroke-width="1.5" />
  <circle cx="630" cy="125" r="3.5" fill="#ffffff" stroke="#00ff66" stroke-width="1.5" />
  <circle cx="740" cy="120" r="4.5" fill="#ffffff" stroke="#00ff66" stroke-width="2" />

  <!-- Tooltip at endpoint -->
  <rect x="648" y="88" width="75" height="22" rx="3" fill="#161b22" stroke="#00f0ff" stroke-width="1"/>
  <text x="686" y="102" text-anchor="middle" class="tooltip-text">Acc: 98.9%</text>
  <line x1="740" y1="111" x2="723" y2="110" stroke="#00f0ff" stroke-width="1" stroke-dasharray="1 1" />

  <!-- Y axis title -->
  <text x="20" y="240" class="axis-label" text-anchor="middle" transform="rotate(-90 20 240)">Accuracy (%)</text>
</svg>
