<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <style>
      .card-bg {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1.5;
        rx: 8px;
        ry: 8px;
      }
      .card-header {
        fill: #161b22;
        rx: 8px;
        ry: 8px;
      }
      .header-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #ffffff;
      }
      .header-meta {
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 11px;
        fill: #8b949e;
      }
      .axis-label {
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 10px;
        fill: #6a737d;
      }
      .legend-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #c9d1d9;
      }
      .tooltip-text {
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 10px;
        fill: #ffffff;
      }
      .grid-line {
        stroke: #21262d;
        stroke-width: 1;
        stroke-dasharray: 2 4;
      }
      .axis-line {
        stroke: #30363d;
        stroke-width: 1.5;
      }
    </style>

    <!-- Glowing Filters -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Area Gradients -->
    <linearGradient id="cyan-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.0"/>
    </linearGradient>
    
    <linearGradient id="green-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="100%" height="100%" class="card-bg"/>

  <!-- Card Header -->
  <path d="M 1.5 18 A 6.5 6.5 0 0 1 8 1.5 L 792 1.5 A 6.5 6.5 0 0 1 798.5 8 L 798.5 40 L 1.5 40 Z" class="card-header"/>
  
  <!-- Header Text -->
  <text x="25" y="25" class="header-title">METRIC_REPORT // TRAINING &amp; AUDITING CURVES</text>
  <text x="775" y="25" text-anchor="end" class="header-meta">DEVICE: WAREHOUSE_ANALYTICS</text>

  <!-- Graph Grid Structure -->
  <g>
    <!-- Y Grid Lines -->
    <line x1="80" y1="80" x2="740" y2="80" class="grid-line" />
    <line x1="80" y1="130" x2="740" y2="130" class="grid-line" />
    <line x1="80" y1="180" x2="740" y2="180" class="grid-line" />
    <line x1="80" y1="230" x2="740" y2="230" class="grid-line" />
    <line x1="80" y1="280" x2="740" y2="280" class="grid-line" />
    <line x1="80" y1="330" x2="740" y2="330" class="grid-line" />
    
    <!-- X Grid Lines -->
    <line x1="190" y1="60" x2="190" y2="330" class="grid-line" />
    <line x1="300" y1="60" x2="300" y2="330" class="grid-line" />
    <line x1="410" y1="60" x2="410" y2="330" class="grid-line" />
    <line x1="520" y1="60" x2="520" y2="330" class="grid-line" />
    <line x1="630" y1="60" x2="630" y2="330" class="grid-line" />
  </g>

  <!-- Y-Axis Labels -->
  <g class="axis-label" text-anchor="end">
    <text x="70" y="83">99.8%</text>
    <text x="70" y="133">99.0%</text>
    <text x="70" y="183">98.0%</text>
    <text x="70" y="233">95.0%</text>
    <text x="70" y="283">90.0%</text>
    <text x="70" y="333">80.0%</text>
  </g>

  <!-- X-Axis Labels -->
  <g class="axis-label" text-anchor="middle">
    <text x="80" y="350">EPOCH 1</text>
    <text x="190" y="350">EPOCH 5</text>
    <text x="300" y="350">EPOCH 10</text>
    <text x="410" y="350">EPOCH 15</text>
    <text x="520" y="350">EPOCH 20</text>
    <text x="630" y="350">EPOCH 25</text>
    <text x="740" y="350">EPOCH 30</text>
  </g>

  <!-- Axis Lines -->
  <line x1="80" y1="60" x2="80" y2="330" class="axis-line" />
  <line x1="80" y1="330" x2="740" y2="330" class="axis-line" />

  <!-- AREA UNDER CURVES -->
  <!-- Cyan Gradient Area (Model A - Anomaly Accuracy) -->
  <!-- Coordinates: 80,260 -> 190,190 -> 300,140 -> 410,100 -> 520,88 -> 630,83 -> 740,81 -->
  <path d="M 80 260 L 190 190 L 300 140 L 410 100 L 520 88 L 630 83 L 740 81 L 740 330 L 80 330 Z" fill="url(#cyan-grad)" />

  <!-- Green Gradient Area (Model B - Shield Detection Score) -->
  <!-- Coordinates: 80,310 -> 190,240 -> 300,190 -> 410,130 -> 520,110 -> 630,95 -> 740,90 -->
  <path d="M 80 310 L 190 240 L 300 190 L 410 130 L 520 110 L 630 95 L 740 90 L 740 330 L 80 330 Z" fill="url(#green-grad)" />

  <!-- GRAPH CURVES (Lines) -->
  <!-- Curve 1 (Cyan) -->
  <path d="M 80 260 L 190 190 L 300 140 L 410 100 L 520 88 L 630 83 L 740 81" fill="none" stroke="#00f0ff" stroke-width="2.5" filter="url(#cyan-glow)" />

  <!-- Curve 2 (Green) -->
  <path d="M 80 310 L 190 240 L 300 190 L 410 130 L 520 110 L 630 95 L 740 90" fill="none" stroke="#00ff66" stroke-width="2.5" filter="url(#green-glow)" />

  <!-- Data Nodes (Dots) -->
  <!-- Cyan Nodes -->
  <circle cx="80" cy="260" r="3.5" fill="#ffffff" stroke="#00f0ff" stroke-width="1.5" />
  <circle cx="300" cy="140" r="3.5" fill="#ffffff" stroke="#00f0ff" stroke-width="1.5" />
  <circle cx="520" cy="88" r="3.5" fill="#ffffff" stroke="#00f0ff" stroke-width="1.5" />
  <circle cx="740" cy="81" r="4.5" fill="#ffffff" stroke="#00f0ff" stroke-width="2" />

  <!-- Green Nodes -->
  <circle cx="190" cy="240" r="3.5" fill="#ffffff" stroke="#00ff66" stroke-width="1.5" />
  <circle cx="410" cy="130" r="3.5" fill="#ffffff" stroke="#00ff66" stroke-width="1.5" />
  <circle cx="630" cy="95" r="3.5" fill="#ffffff" stroke="#00ff66" stroke-width="1.5" />
  <circle cx="740" cy="90" r="4.5" fill="#ffffff" stroke="#00ff66" stroke-width="2" />

  <!-- Tooltip Dialog box on Cyan Endpoint -->
  <g transform="translate(680, 48)">
    <rect x="0" y="0" width="70" height="22" rx="3" fill="#161b22" stroke="#00f0ff" stroke-width="1"/>
    <text x="35" y="14" text-anchor="middle" class="tooltip-text">Acc: 98.9%</text>
  </g>
  <line x1="740" y1="81" x2="715" y2="70" stroke="#00f0ff" stroke-width="1" stroke-dasharray="1 1" />

  <!-- Graph Legends (Upper Right) -->
  <g transform="translate(480, 20)">
    <!-- Legend Item 1 (Cyan) -->
    <rect x="0" y="3" width="12" height="6" fill="#00f0ff" rx="1"/>
    <text x="18" y="10" class="legend-text">ML Outlier Anomaly Accuracy</text>
    
    <!-- Legend Item 2 (Green) -->
    <rect x="210" y="3" width="12" height="6" fill="#00ff66" rx="1"/>
    <text x="228" y="10" class="legend-text">Intrusion Detection F1</text>
  </g>
</svg>
