<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
      .card-header { fill: #161b22; }
      .header-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #8b949e; }
      .comment { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 12.5px; fill: #6a737d; }
      .prompt  { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 12.5px; fill: #58a6ff; }
      .cmd     { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 12.5px; fill: #ffffff; }
      .out     { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 12.5px; fill: #c9d1d9; }
      .ok      { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 12.5px; fill: #00ff66; }
      .col-key { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 12.5px; fill: #6a737d; }
      .venv    { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 12.5px; fill: #f2c811; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="card-bg" rx="8" ry="8"/>

  <!-- Header bar -->
  <path d="M 1.5 18 A 6.5 6.5 0 0 1 8 1.5 L 792 1.5 A 6.5 6.5 0 0 1 798.5 8 L 798.5 40 L 1.5 40 Z" class="card-header"/>
  <circle cx="25" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="45" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="65" cy="20" r="6" fill="#27c93f"/>
  <text x="400" y="25" text-anchor="middle" class="header-text">bash — Profile Information Query</text>

  <!-- ── BLOCK 1: whoami ── -->
  <text x="25" y="68"  class="comment"># Query active user profile</text>
  <text x="25" y="92"  class="prompt">user@charaf-sec:~$</text><text x="175" y="92"  class="cmd"> whoami</text>
  <text x="25" y="115" class="ok">soubi_charaf</text>

  <!-- ── BLOCK 2: cat specialization.json ── -->
  <text x="25" y="140" class="prompt">user@charaf-sec:~$</text><text x="175" y="140" class="cmd"> cat specialization.json</text>
  <text x="25" y="163" class="out">{</text>
  <text x="45" y="183" class="out">"name"    : "Soubi Charaf",</text>
  <text x="45" y="203" class="out">"domains" : ["Cybersecurity", "Data Analyst", "Web Developer", "Mobile Developer"],</text>
  <text x="45" y="223" class="out">"location": "Beni Mellal, Morocco",</text>
  <text x="45" y="243" class="out">"skills"  : ["PostgreSQL","Python","SQL","Flutter","SQLite","Laravel","Wireshark","Nmap"]</text>
  <text x="25" y="263" class="out">}</text>

  <!-- ── BLOCK 3: nmap (fully inside viewBox) ── -->
  <text x="25" y="288" class="comment"># Audit communication ports</text>
  <text x="25" y="310" class="prompt">user@charaf-sec:~$</text><text x="175" y="310" class="cmd"> nmap -sV localhost</text>

  <!-- nmap column headers -->
  <text x="25"  y="332" class="col-key">PORT</text>
  <text x="145" y="332" class="col-key">STATE</text>
  <text x="240" y="332" class="col-key">SERVICE</text>
  <text x="380" y="332" class="col-key">VERSION</text>

  <!-- nmap rows -->
  <text x="25"  y="354" class="ok">22/tcp</text>
  <text x="145" y="354" class="out">open</text>
  <text x="240" y="354" class="out">ssh</text>
  <text x="380" y="354" class="out">OpenSSH 8.4  (LinkedIn Tunnel)</text>

  <text x="25"  y="375" class="ok">443/tcp</text>
  <text x="145" y="375" class="out">open</text>
  <text x="240" y="375" class="out">ssl/https</text>
  <text x="380" y="375" class="out">Nginx  (Secure Mail Node)</text>

  <text x="25"  y="396" class="ok">8080/tcp</text>
  <text x="145" y="396" class="out">open</text>
  <text x="240" y="396" class="out">http</text>
  <text x="380" y="396" class="out">Apache (WhatsApp Endpoint)</text>

  <!-- ── Final prompt + blinking cursor ── -->
  <text x="25" y="440" class="prompt">user@charaf-sec:~$</text>
  <rect x="177" y="427" width="8" height="15" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
