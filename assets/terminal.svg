<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
      .card-header { fill: #161b22; }
      .header-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #8b949e; }
      .comment { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 12.5px; fill: #6a737d; }
      .prompt  { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 12.5px; fill: #58a6ff; }
      .cmd     { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 12.5px; fill: #ffffff; }
      .out     { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 12.5px; fill: #c9d1d9; }
      .ok      { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 12.5px; fill: #00ff66; }
      .warn    { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 12.5px; fill: #f2c811; }
      .deny    { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 12.5px; fill: #ff6b6b; }
      .code    { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 12.5px; fill: #d2a8ff; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="card-bg" rx="8" ry="8"/>

  <!-- Header bar -->
  <path d="M 1.5 18 A 6.5 6.5 0 0 1 8 1.5 L 792 1.5 A 6.5 6.5 0 0 1 798.5 8 L 798.5 40 L 1.5 40 Z" class="card-header"/>
  <circle cx="25" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="45" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="65" cy="20" r="6" fill="#27c93f"/>
  <text x="400" y="25" text-anchor="middle" class="header-text">bash — SOUBI Charaf / Secure Profile Query</text>

  <!-- BLOCK 1 -->
  <text x="25" y="68" class="comment"># Identify public profile owner</text>
  <text x="25" y="92" class="prompt">user@soubi-sec:~$</text>
  <text x="177" y="92" class="cmd"> whoami</text>
  <text x="25" y="115" class="ok">SOUBI Charaf</text>

  <!-- BLOCK 2 -->
  <text x="25" y="140" class="prompt">user@soubi-sec:~$</text>
  <text x="177" y="140" class="cmd"> cat domain.txt</text>
  <text x="25" y="163" class="out">[01] Data Analyst</text>
  <text x="25" y="183" class="out">[02] Mobile Developer</text>
  <text x="25" y="203" class="out">[03] Web Developer</text>
  <text x="25" y="223" class="out">[04] Cybersecurity Analyst</text>

  <!-- BLOCK 3 -->
  <text x="25" y="248" class="comment"># Scan public footprint / portfolio endpoint</text>
  <text x="25" y="270" class="prompt">user@soubi-sec:~$</text>
  <text x="177" y="270" class="cmd"> scan --portfolio</text>
  <text x="25" y="292" class="out">[*] Searching public profile...</text>
  <text x="25" y="312" class="out">[*] Checking exposed information...</text>
  <text x="25" y="332" class="ok">[+] Portfolio found:</text>
  <text x="175" y="332" class="ok">https://soubicharaf.netlify.app/</text>

  <!-- BLOCK 4 -->
  <text x="25" y="357" class="prompt">user@soubi-sec:~$</text>
  <text x="177" y="357" class="cmd"> search --about-me</text>
  <text x="25" y="379" class="warn">[!] Attempting to retrieve protected information...</text>
  <text x="25" y="399" class="deny">[x] ACCESS DENIED — private data protected</text>

  <!-- BLOCK 5 -->
  <text x="25" y="424" class="prompt">user@soubi-sec:~$</text>
  <text x="177" y="424" class="cmd"> run --code decrypt_contact.py</text>

  <text x="25" y="444" class="code">[*] Executing challenge...</text>
  <text x="225" y="444" class="out">████████████████████ 100%</text>

  <text x="25" y="463" class="ok">[+] DECRYPTED:</text>
  <text x="130" y="463" class="ok">soubicharaf@gmail.com</text>

  <!-- Cursor -->
  <rect x="320" y="449" width="7" height="15" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>